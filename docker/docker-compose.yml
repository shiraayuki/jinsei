services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Production
      # Single-user deployment: flip to true only while creating an account.
      Auth__AllowRegistration: "false"
      # Hevy is the only sync source; without a key the sync button reports
      # itself as unconfigured and nothing else changes.
      Hevy__ApiKey: ${HEVY_API_KEY:-}
      Hevy__TimeZone: ${TZ:-Europe/Vienna}
      # The log starts here; sessions before it are never pulled. Unset means
      # everything Hevy still has.
      Hevy__SyncFrom: ${HEVY_SYNC_FROM:-2026-08-17}
      # One pull a day, at this local time, plus one on startup.
      Hevy__SyncAtLocal: ${HEVY_SYNC_AT:-19:30}
      # Reads screenshots of Sleep Cycle / FatSecret into a draft. Without a
      # key the import button stays hidden and everything is entered by hand.
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-gemini-3.6-flash}
      # Web Push. Without a VAPID pair the notification card hides itself and
      # the scheduler does nothing; generate one with `-- vapid`.
      Push__VapidPublicKey: ${VAPID_PUBLIC_KEY:-}
      Push__VapidPrivateKey: ${VAPID_PRIVATE_KEY:-}
      Push__Subject: ${VAPID_SUBJECT:-}
      Notifications__EveningCheckAtLocal: ${NOTIFY_EVENING_CHECK_AT:-21:00}
      Notifications__WeeklyReviewAtLocal: ${NOTIFY_WEEKLY_REVIEW_AT:-20:00}
      # The weekly calorie-target update, in the same zone as everything else.
      Energy__RunAtLocal: ${ENERGY_RUN_AT:-04:30}
      # The nightly daily-report generation, skipped if one already exists.
      Reports__RunAtLocal: ${REPORTS_RUN_AT:-23:30}
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
      # Claude Code's own login state (OAuth session, not an API key). Named
      # volume rather than a host bind mount, so it survives rebuilds without
      # the compose file needing to know a host path — log in once with
      # `docker compose exec backend claude login` after the first deploy.
      - claude_home:/root
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      # Loopback only: TLS + exposure are handled by `tailscale serve` on the host.
      - "127.0.0.1:8092:80"
    depends_on:
      - backend
    restart: unless-stopped


volumes:
  postgres_data:
  dataprotection_keys:
  claude_home:
