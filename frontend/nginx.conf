server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed filenames, so they can be cached indefinitely. A miss has to 404
    # instead of falling through to index.html: a stale document asking for a
    # chunk that no longer exists would otherwise receive HTML with a 200, the
    # module would fail to parse, and the app would render nothing at all.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The document and the worker must be revalidated on every load. Without
    # this nginx sends no Cache-Control at all, browsers fall back to heuristic
    # caching, and a client stays pinned to a build whose chunks are gone.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        # nginx has no mime type for this extension and falls back to
        # application/octet-stream, which browsers are entitled to ignore.
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # A screenshot is posted as base64 JSON, which is well past the 1 MB
        # nginx allows by default.
        client_max_body_size 12m;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
