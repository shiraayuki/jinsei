<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090909" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Jinsei" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <!--
      iOS reads this one for the home screen, wants 180x180, and composites any
      transparency onto black before applying its own corner mask — so this file
      is an opaque full-bleed square rather than the rounded manifest icon.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Jinsei</title>
  </head>
  <body>
    <script>
      if ((localStorage.getItem('jinsei:theme') ?? 'dark') === 'dark') {
        document.documentElement.classList.add('dark')
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
