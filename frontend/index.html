<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      One tag rather than a pair keyed on prefers-color-scheme: the appearance
      can now be set against the system, and a media query cannot know that.
      The script below and the theme provider both write it.
    -->
    <meta id="theme-color" name="theme-color" content="#f2f2f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jinsei" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <!--
      iOS reads this one for the home screen, wants 180x180, and composites any
      transparency onto black before applying its own corner mask — so this file
      is an opaque full-bleed square rather than the rounded manifest icon.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Jinsei</title>
  </head>
  <body>
    <script>
      // Three states, resolved here rather than a frame later: 'dark' and
      // 'light' are a decision, and anything else — including nothing stored —
      // means follow the system, which is what every other app on the phone
      // does.
      var stored = localStorage.getItem('jinsei:theme')
      var dark = stored === 'dark' ||
        (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) document.documentElement.classList.add('dark')
      document.getElementById('theme-color').setAttribute('content', dark ? '#000000' : '#f2f2f7')
      // Same reason as the line above: without this the first paint is the
      // default palette and the chosen one arrives a frame later, as a flash.
      var palette = localStorage.getItem('jinsei:palette')
      if (palette === 'jinsei' || palette === 'rosepine' || palette === 'catppuccin') {
        document.documentElement.setAttribute('data-theme', palette)
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
